---
layout: default
---
<article>
  <div class="post-head">
    <h1>{{ page.title }}</h1>
    {%- if page.subtitle %}
    <p class="dek">{{ page.subtitle }}</p>
    {%- endif %}
  </div>

  <div class="post-body">
    {{ content }}
  </div>
</article>

<a class="back" href="{{ '/' | relative_url }}">← All posts</a>
